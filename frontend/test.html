<!DOCTYPE html>
<html>
<head><title>Test</title></head>
<body>
    <h1>Network Test</h1>
    <button onclick="testAPI()">Test API</button>
    <pre id="output"></pre>
    <script>
    async function testAPI() {
        const output = document.getElementById('output');
        const ip = prompt('Enter your PC IP address:', '10.233.131.108');
        try {
            const response = await fetch(`http://${ip}:8080/api/users`);
            const data = await response.json();
            output.textContent = '✅ SUCCESS!\n' + JSON.stringify(data, null, 2);
        } catch (error) {
            output.textContent = '❌ ERROR:\n' + error.message;
        }
    }
    </script>
</body>
</html>
